[package]
name = "j2534-tester"
version = "0.1.0"
edition = "2021"
description = "J2534 Tester Application"
license = "MIT"
repository = ""
authors = []

[lib]
name = "j2534_tester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "j2534-tester"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hex = "0.4"

# Windows-specific dependencies for J2534
[target.'cfg(windows)'.dependencies]
libloading = "0.8"
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
