<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="usbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.5"/>

  <!-- USB Connector Body -->
  <rect x="85" y="45" width="86" height="110" rx="8" ry="8" fill="url(#usbGrad)"/>

  <!-- USB Connector inner details -->
  <rect x="100" y="60" width="56" height="80" rx="4" ry="4" fill="#1e293b"/>

  <!-- USB pins -->
  <rect x="110" y="70" width="8" height="25" rx="2" ry="2" fill="#f59e0b"/>
  <rect x="124" y="70" width="8" height="25" rx="2" ry="2" fill="#f59e0b"/>
  <rect x="138" y="70" width="8" height="25" rx="2" ry="2" fill="#f59e0b"/>

  <!-- USB symbol on connector -->
  <circle cx="128" cy="120" r="8" fill="none" stroke="#60a5fa" stroke-width="3"/>
  <line x1="128" y1="112" x2="128" y2="100" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>

  <!-- Data flow lines (representing CAN bus / diagnostic data) -->
  <g opacity="0.9">
    <!-- Left data stream -->
    <rect x="45" y="170" width="40" height="6" rx="3" fill="url(#dataGrad)"/>
    <rect x="55" y="182" width="30" height="6" rx="3" fill="url(#dataGrad)" opacity="0.7"/>
    <rect x="50" y="194" width="35" height="6" rx="3" fill="url(#dataGrad)" opacity="0.5"/>

    <!-- Right data stream -->
    <rect x="171" y="170" width="40" height="6" rx="3" fill="url(#dataGrad)"/>
    <rect x="171" y="182" width="30" height="6" rx="3" fill="url(#dataGrad)" opacity="0.7"/>
    <rect x="176" y="194" width="35" height="6" rx="3" fill="url(#dataGrad)" opacity="0.5"/>
  </g>

  <!-- Center connector / hub -->
  <circle cx="128" cy="182" r="20" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="128" cy="182" r="10" fill="#3b82f6"/>

  <!-- Connection lines from USB to hub -->
  <line x1="128" y1="155" x2="128" y2="162" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>

  <!-- Arrows pointing to data streams -->
  <path d="M108 182 L90 182" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <path d="M148 182 L166 182" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
</svg>
